{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ .Release.Namespace }}
  annotations: 
    appgw.ingress.kubernetes.io/health-monitor-path: "/"
    appgw.ingress.kubernetes.io/use-private-ip: "false"
    appgw.ingress.kubernetes.io/request-timeout: "60"
spec:
  rules:
    - host: dev-api.paymentapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-api-service
                port:
                  number: {{ .Values.paymentApi.service.port }}
{{- end -}}