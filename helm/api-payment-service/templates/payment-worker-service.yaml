apiVersion: v1
kind: Service
metadata:
  name: payment-worker-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.paymentWorker.service.type }}
  ports:
  - port: {{ .Values.paymentWorker.service.port }}
    targetPort: {{ .Values.paymentWorker.deployment.exposePort }}
  selector:
    app: {{ .Values.paymentWorker.deployment.appLabel }}