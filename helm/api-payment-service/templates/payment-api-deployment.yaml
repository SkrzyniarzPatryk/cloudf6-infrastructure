apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.paymentApi.deployment.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.paymentApi.deployment.appLabel }}
  replicas: {{ ternary .Values.paymentApi.autoscaling.minReplicas .Values.paymentApi.deployment.replicas .Values.paymentApi.autoscaling.enabled }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.paymentApi.deployment.appLabel }}
    spec:
      containers:
      - name: {{ .Values.paymentApi.deployment.appLabel }}
        image: {{ include "paymentApi.image" . }}

        {{- if .Values.paymentApi.deployment.resources.enabled }}
        resources:
          requests:
            memory: {{ .Values.paymentApi.deployment.resources.requests.memory }}
            cpu: {{ .Values.paymentApi.deployment.resources.requests.cpu }}
          limits:
            memory: {{ .Values.paymentApi.deployment.resources.limits.memory }}
            cpu: {{ .Values.paymentApi.deployment.resources.limits.cpu }}
        {{- end}}

        {{- if .Values.paymentApi.deployment.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.paymentApi.deployment.livenessProbe.path }}
            port: {{ .Values.paymentApi.deployment.livenessProbe.port }}
          initialDelaySeconds: {{ .Values.paymentApi.deployment.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.paymentApi.deployment.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.paymentApi.deployment.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.paymentApi.deployment.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.paymentApi.deployment.livenessProbe.successThreshold }}
        {{- end}}

        {{- if .Values.paymentApi.deployment.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.paymentApi.deployment.readinessProbe.path }}
            port: {{ .Values.paymentApi.deployment.readinessProbe.port }}
          initialDelaySeconds: {{ .Values.paymentApi.deployment.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.paymentApi.deployment.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.paymentApi.deployment.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.paymentApi.deployment.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.paymentApi.deployment.readinessProbe.successThreshold }}
        {{- end}}

        ports:
          - containerPort: {{ .Values.paymentApi.deployment.exposePort }}