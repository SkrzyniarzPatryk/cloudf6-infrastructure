paymentWorker:
  deployment:
    name: payment-worker-deployment
    appLabel: payment-worker
    replicas: 1
    exposePort: 8090
    image:
      repository: javaservicescontainerregistry123.azurecr.io/javaapps/payment-worker
      tag: 1.0.0
    resources:
      enabled: true # Do you want limit resource?
      requests:
        memory: "600Mi"
        cpu: "300m"
      limits:
        memory: "800Mi"
        cpu: "500m"
    livenessProbe:
      enabled: true
      path: /actuator/health
      port: 8090
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      enabled: true
      path: /actuator/health
      port: 8090
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1

  service:
    type: ClusterIP # LoadBalancer # changed to cluster for AGIC ingress
    port: 80






